<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Admin Resources</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
		<script src="../../js/crypto.js"></script>
		<script src="../../js/auth.js"></script>
		<script src="../../js/admin/resources.js"></script>

		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		/>
		<script>
			tailwind.config = {
				darkMode: "class",
				theme: {
					extend: {
						colors: {
							primary: "#8B1C23",
							secondary: "#A52A2A",
						},
					},
				},
			};
		</script>
		<style>
			@media (min-width: 1024px) {
				nav.with-sidebar {
					left: 16rem !important;
				}
			}
			@media (max-width: 1023px) {
				#sidebar {
					z-index: 60 !important;
				}
				#topNav {
					z-index: 50 !important;
				}
				body.sidebar-open #topNav {
					display: none;
				}
			}
			/* Additional styles for modals or other elements can go here */
			.modal {
				transition: opacity 0.25s ease;
			}
			.modal-content {
				transition: transform 0.25s ease;
			}
		</style>
	</head>
	<body
		class="bg-gray-100 dark:bg-gray-900 dark:text-gray-100 transition-colors"
	>
		<div
			id="sidebar"
			class="fixed top-0 left-0 h-full w-64 bg-primary text-white shadow-lg transition-transform duration-300 z-40"
		>
			<div class="p-4">
				<div class="flex items-center justify-between mb-8">
					<img src="../../images/imfLogo.png" alt="Logo" class="h-12" />
					<button
						id="closeSidebar"
						class="text-white hover:bg-secondary hover:text-white focus:outline-none p-2 rounded-full transition-colors border border-white/20"
						title="Close sidebar"
					>
						<i class="fas fa-chevron-left text-2xl"></i>
					</button>
				</div>
				<hr class="border-white/20 mb-6" />
				<nav>
					<ul class="space-y-2">
						<li>
							<a
								href="dashboard.html"
								class="flex items-center space-x-3 p-3 rounded-lg hover:bg-secondary/80 transition-colors group"
							>
								<i
									class="fas fa-home group-hover:scale-110 transition-transform"
								></i>
								<span>Dashboard</span>
							</a>
						</li>
						<li>
							<a
								href="employees.html"
								class="flex items-center space-x-3 p-3 rounded-lg hover:bg-secondary/80 transition-colors group"
							>
								<i
									class="fas fa-users group-hover:scale-110 transition-transform"
								></i>
								<span>Employees</span>
							</a>
						</li>
						<li>
							<a
								href="reports.html"
								class="flex items-center space-x-3 p-3 rounded-lg hover:bg-secondary/80 transition-colors group"
							>
								<i
									class="fas fa-chart-bar group-hover:scale-110 transition-transform"
								></i>
								<span>Reports</span>
							</a>
						</li>
						<li>
							<a
								href="resources.html"
								class="flex items-center space-x-3 p-3 rounded-lg bg-secondary/80 text-white transition-colors group"
							>
								<i
									class="fas fa-cogs group-hover:scale-110 transition-transform"
								></i>
								<span>Resources</span>
							</a>
						</li>
						<li>
							<a
								href="#"
								class="flex items-center space-x-3 p-3 rounded-lg hover:bg-secondary/80 transition-colors group"
							>
								<i
									class="fas fa-cog group-hover:scale-110 transition-transform"
								></i>
								<span>Settings</span>
							</a>
						</li>
					</ul>
				</nav>
			</div>
		</div>

		<div
			id="sidebarOverlay"
			class="fixed inset-0 bg-black bg-opacity-30 z-30 hidden transition-opacity duration-300"
		></div>

		<div id="mainContent" class="transition-all duration-300">
			<nav
				id="topNav"
				class="fixed top-0 left-0 right-0 z-50 bg-white dark:bg-gray-800 shadow-lg transition-all duration-300"
			>
				<div class="max-w-full mx-auto px-4">
					<div class="flex justify-between items-center h-16">
						<div class="flex items-center">
							<button
								id="openSidebar"
								class="text-gray-500 hover:bg-primary hover:text-white p-2 rounded-full transition-colors border border-gray-300 mr-2 shadow-sm"
							>
								<i class="fas fa-bars text-xl"></i>
							</button>
							<h1
								class="ml-2 text-xl font-semibold text-gray-800 dark:text-gray-100"
							>
								Manage Resources
							</h1>
						</div>
						<div class="flex items-center space-x-4">
							<div class="relative">
								<button
									id="userMenuBtn"
									class="flex items-center space-x-2 text-gray-700 dark:text-gray-100 hover:text-primary focus:outline-none"
								>
									<span
										id="userAvatar"
										class="h-8 w-8 rounded-full bg-primary flex items-center justify-center text-white font-bold text-sm"
									></span>
									<span id="userFirstName" class="hidden md:block"></span>
									<i class="fas fa-chevron-down ml-1"></i>
								</button>
								<div
									id="userDropdown"
									class="hidden absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-md shadow-lg py-2 z-50"
								>
									<a
										href="#"
										class="block px-4 py-2 text-gray-700 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-gray-700"
										><i class="fas fa-user mr-2"></i>Profile</a
									>
									<button
										id="toggleDarkMode"
										class="w-full text-left px-4 py-2 text-gray-700 dark:text-gray-100 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center"
									>
										<i class="fas fa-moon mr-2"></i
										><span id="darkModeText">Dark Mode</span>
									</button>
									<button
										id="logoutBtn"
										class="w-full text-left px-4 py-2 text-red-600 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center"
									>
										<i class="fas fa-sign-out-alt mr-2"></i>Log Out
									</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</nav>

			<main class="p-6 pt-24 lg:pt-20">
				<section id="cashMethodsSection" class="mb-8">
					<div class="flex justify-between items-center mb-4">
						<h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-100">
							Cash Methods
						</h2>
						<button
							id="addCashMethodBtn"
							class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-secondary transition-colors flex items-center"
						>
							<i class="fas fa-plus mr-2"></i> Add Cash Method
						</button>
					</div>
					<div
						id="cashMethodsContainer"
						class="bg-white dark:bg-gray-800 rounded-lg shadow p-6"
					>
						<p class="text-gray-500 dark:text-gray-400">
							Loading cash methods...
						</p>
					</div>
				</section>

				<section id="statusRequestsSection" class="mb-8">
					<div class="flex justify-between items-center mb-4">
						<h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-100">
							Status Requests
						</h2>
						<button
							id="addStatusRequestBtn"
							class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-secondary transition-colors flex items-center"
						>
							<i class="fas fa-plus mr-2"></i> Add Status Request
						</button>
					</div>
					<div
						id="statusRequestsContainer"
						class="bg-white dark:bg-gray-800 rounded-lg shadow p-6"
					>
						<p class="text-gray-500 dark:text-gray-400">
							Loading status requests...
						</p>
					</div>
				</section>

				<section id="userLevelsSection" class="mb-8">
					<div class="flex justify-between items-center mb-4">
						<h2 class="text-2xl font-semibold text-gray-800 dark:text-gray-100">
							User Levels
						</h2>
						<button
							id="addUserLevelBtn"
							class="bg-primary text-white px-4 py-2 rounded-lg hover:bg-secondary transition-colors flex items-center"
						>
							<i class="fas fa-plus mr-2"></i> Add User Level
						</button>
					</div>
					<div
						id="userLevelsContainer"
						class="bg-white dark:bg-gray-800 rounded-lg shadow p-6"
					>
						<p class="text-gray-500 dark:text-gray-400">
							Loading user levels...
						</p>
					</div>
				</section>
			</main>
		</div>

		<div
			id="toast"
			class="fixed bottom-6 right-6 z-[100] min-w-[250px] max-w-xs rounded-lg shadow-lg px-6 py-4 flex items-center space-x-3 transition-all duration-300 hidden"
		>
			<i id="toastIcon" class="fas fa-check-circle"></i>
			<span id="toastMessage"></span>
		</div>

		<div id="modalPlaceholder"></div>

		<script>
			const sidebar = document.getElementById("sidebar");
			const mainContent = document.getElementById("mainContent");
			const openSidebarBtn = document.getElementById("openSidebar");
			const closeSidebarBtn = document.getElementById("closeSidebar");
			const sidebarOverlay = document.getElementById("sidebarOverlay");
			const topNav = document.getElementById("topNav");

			function toggleSidebar(show) {
				if (show) {
					sidebar.classList.remove("-translate-x-full");
					mainContent.classList.add("md:ml-64");
					if (window.innerWidth >= 1024) {
						topNav.classList.add("with-sidebar");
					}
					if (window.innerWidth < 1024) {
						sidebarOverlay.classList.remove("hidden");
						sidebarOverlay.classList.add("block");
					}
					if (openSidebarBtn) openSidebarBtn.classList.add("hidden");
				} else {
					sidebar.classList.add("-translate-x-full");
					mainContent.classList.remove("md:ml-64");
					topNav.classList.remove("with-sidebar");
					sidebarOverlay.classList.remove("block");
					sidebarOverlay.classList.add("hidden");
					if (openSidebarBtn) openSidebarBtn.classList.remove("hidden");
				}
			}

			function initializeSidebar() {
				if (window.innerWidth >= 1024) {
					toggleSidebar(true);
				} else {
					toggleSidebar(false);
				}
			}
			initializeSidebar();
			window.addEventListener("resize", initializeSidebar);

			if (openSidebarBtn)
				openSidebarBtn.addEventListener("click", (e) => {
					e.stopPropagation();
					toggleSidebar(true);
				});
			if (closeSidebarBtn)
				closeSidebarBtn.addEventListener("click", (e) => {
					e.stopPropagation();
					toggleSidebar(false);
				});
			if (sidebarOverlay)
				sidebarOverlay.addEventListener("click", () => toggleSidebar(false));
			if (sidebar)
				sidebar.addEventListener("click", (e) => e.stopPropagation());

			const userMenuBtn = document.getElementById("userMenuBtn");
			const userDropdown = document.getElementById("userDropdown");
			if (userMenuBtn)
				userMenuBtn.addEventListener("click", function (e) {
					e.stopPropagation();
					userDropdown.classList.toggle("hidden");
				});
			document.addEventListener("click", function (e) {
				if (userDropdown && userMenuBtn && !userMenuBtn.contains(e.target)) {
					userDropdown.classList.add("hidden");
				}
			});

			const user = getSecureSession("user");
			if (user) {
				const initials =
					(user.user_firstname[0] || "") + (user.user_lastname[0] || "");
				if (document.getElementById("userAvatar"))
					document.getElementById("userAvatar").textContent =
						initials.toUpperCase();
				if (document.getElementById("userFirstName"))
					document.getElementById("userFirstName").textContent =
						user.user_firstname;
			}

			const html = document.documentElement;
			const darkModeBtn = document.getElementById("toggleDarkMode");
			const darkModeText = document.getElementById("darkModeText");
			function setDarkMode(isDark) {
				if (isDark) {
					html.classList.add("dark");
					localStorage.setItem("theme", "dark");
					if (darkModeText) darkModeText.textContent = "Light Mode";
					if (darkModeBtn) {
						darkModeBtn.querySelector("i").classList.remove("fa-moon");
						darkModeBtn.querySelector("i").classList.add("fa-sun");
					}
				} else {
					html.classList.remove("dark");
					localStorage.setItem("theme", "light");
					if (darkModeText) darkModeText.textContent = "Dark Mode";
					if (darkModeBtn) {
						darkModeBtn.querySelector("i").classList.remove("fa-sun");
						darkModeBtn.querySelector("i").classList.add("fa-moon");
					}
				}
			}
			if (localStorage.getItem("theme") === "dark") {
				setDarkMode(true);
			} else {
				setDarkMode(false);
			}
			if (darkModeBtn)
				darkModeBtn.addEventListener("click", function (e) {
					e.stopPropagation();
					setDarkMode(!html.classList.contains("dark"));
				});

			const logoutBtn = document.getElementById("logoutBtn");
			if (logoutBtn)
				logoutBtn.addEventListener("click", function () {
					clearSecureSession("user");
					window.location.href = "../login.html";
				});

			function showToast(message, type = "success") {
				const toast = document.getElementById("toast");
				const toastMessage = document.getElementById("toastMessage");
				const toastIcon = document.getElementById("toastIcon");

				toastMessage.textContent = message;
				toast.classList.remove(
					"hidden",
					"bg-green-500",
					"bg-red-500",
					"bg-blue-500",
					"dark:bg-green-700",
					"dark:bg-red-700",
					"dark:bg-blue-700"
				);
				toastIcon.classList.remove(
					"fa-check-circle",
					"fa-times-circle",
					"fa-info-circle"
				);

				if (type === "success") {
					toast.classList.add(
						"bg-green-100",
						"dark:bg-green-800",
						"text-green-700",
						"dark:text-green-200"
					);
					toastIcon.classList.add(
						"fa-check-circle",
						"text-green-500",
						"dark:text-green-400"
					);
				} else if (type === "error") {
					toast.classList.add(
						"bg-red-100",
						"dark:bg-red-800",
						"text-red-700",
						"dark:text-red-200"
					);
					toastIcon.classList.add(
						"fa-times-circle",
						"text-red-500",
						"dark:text-red-400"
					);
				} else {
					toast.classList.add(
						"bg-blue-100",
						"dark:bg-blue-800",
						"text-blue-700",
						"dark:text-blue-200"
					);
					toastIcon.classList.add(
						"fa-info-circle",
						"text-blue-500",
						"dark:text-blue-400"
					);
				}

				toast.classList.remove("hidden");
				toast.classList.add("opacity-100");

				setTimeout(() => {
					toast.classList.add("opacity-0");
					setTimeout(() => toast.classList.add("hidden"), 300);
				}, 3000);
			}
		</script>
	</body>
</html>
